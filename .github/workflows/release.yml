name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/HaTTaPticPlugin.csproj -p:PluginApiDir=${{ github.workspace }}/lib/

      - name: Build
        run: dotnet build src/HaTTaPticPlugin.csproj -c Release -p:PluginApiDir=${{ github.workspace }}/lib/ -p:SkipPostBuild=true --no-restore

      - name: Package .lplug4
        run: |
          cd bin/Release
          zip -r ${{ github.workspace }}/HaTTaPtic.lplug4 . -x "*.pdb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaTTaPtic.lplug4
          path: HaTTaPtic.lplug4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: HaTTaPtic.lplug4
          generate_release_notes: true
