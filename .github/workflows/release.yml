name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install LogiPluginTool
        run: dotnet tool install --global LogiPluginTool

      - name: Restore
        run: dotnet restore src/HaTTaPticPlugin.csproj -p:PluginApiDir=${{ github.workspace }}/lib/

      - name: Build
        run: dotnet build src/HaTTaPticPlugin.csproj -c Release -p:PluginApiDir=${{ github.workspace }}/lib/ -p:SkipPostBuild=true --no-restore

      - name: Package .lplug4
        run: logiplugintool pack ./bin/Release/ ./HaTTaPtic.lplug4

      - name: Verify .lplug4
        run: logiplugintool verify ./HaTTaPtic.lplug4

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: HaTTaPtic.lplug4
          path: HaTTaPtic.lplug4

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: HaTTaPtic.lplug4
          generateReleaseNotes: true
